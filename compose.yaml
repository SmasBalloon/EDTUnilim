# Emplois du temps de l'IUT informatique de Limoges :
# l'API Rust qui lit les PDF, et l'interface SolidJS servie par nginx.
#
#   docker compose up -d --build      →  http://localhost:8080

# Journaux Docker plafonnés : trois fichiers de 10 Mo par service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./APIRust
    image: edt-unilim-api
    restart: unless-stopped
    logging: *logging
    environment:
      # Racine des PDF publiés par le département.
      EDT_UPSTREAM: ${EDT_UPSTREAM:-https://edt-iut-info.unilim.fr/edt}
      # Périodicité de la revalidation des emplois du temps déjà consultés.
      EDT_REFRESH_SECONDS: ${EDT_REFRESH_SECONDS:-900}
      EDT_UPSTREAM_TIMEOUT_SECONDS: ${EDT_UPSTREAM_TIMEOUT_SECONDS:-15}
      # Adresse publique du site : l'URL de retour OAuth en dépend.
      EDT_PUBLIC_URL: ${EDT_PUBLIC_URL:-http://localhost:8080}
      # Connexion Discord et messages privés (facultatif : tout ou rien).
      EDT_DISCORD_CLIENT_ID: ${EDT_DISCORD_CLIENT_ID:-}
      EDT_DISCORD_CLIENT_SECRET: ${EDT_DISCORD_CLIENT_SECRET:-}
      EDT_DISCORD_BOT_TOKEN: ${EDT_DISCORD_BOT_TOKEN:-}
      EDT_DISCORD_GUILD_ID: ${EDT_DISCORD_GUILD_ID:-}
      EDT_DISCORD_KNOWN_GUILD_IDS: ${EDT_DISCORD_KNOWN_GUILD_IDS:-}
      # Comptes prévenus des salles réservées en double (vide : aucun envoi).
      EDT_DISCORD_CONFLICT_RECIPIENTS: ${EDT_DISCORD_CONFLICT_RECIPIENTS:-429319137710440449,682531276078841881,391597830932004864}
      # Comptes qui voient les PDF en cache et en déposent quand le serveur du
      # département est injoignable (page #pdf).
      EDT_DISCORD_ADMINS: ${EDT_DISCORD_ADMINS:-682531276078841881}
      # Clé publique de l'application : elle allume les commandes slash du bot.
      EDT_DISCORD_PUBLIC_KEY: ${EDT_DISCORD_PUBLIC_KEY:-}
      EDT_SESSION_SECRET: ${EDT_SESSION_SECRET:-}
      EDT_LOG: ${EDT_LOG:-info}
    volumes:
      # Les PDF téléchargés survivent aux redémarrages : le service continue de
      # répondre même si le serveur du département est indisponible.
      - edt-cache:/app/cache
      # Comptes et classes suivies : à sauvegarder.
      - edt-state:/app/state
    expose:
      - "3000"
    # Décommenter pour joindre l'API directement, hors de nginx.
    # ports:
    #   - "3000:3000"

  web:
    build:
      context: ./frontend
    image: edt-unilim-front
    restart: unless-stopped
    logging: *logging
    ports:
      - "${EDT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  edt-cache:
  edt-state:
