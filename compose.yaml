# Emplois du temps de l'IUT informatique de Limoges :
# l'API Rust qui lit les PDF, et l'interface SolidJS servie par nginx.
#
#   docker compose up -d --build      →  http://localhost:8080

services:
  api:
    build:
      context: ./APIRust
    image: edt-unilim-api
    restart: unless-stopped
    environment:
      # Racine des PDF publiés par le département.
      EDT_UPSTREAM: ${EDT_UPSTREAM:-https://edt-iut-info.unilim.fr/edt}
      # Périodicité de la revalidation des emplois du temps déjà consultés.
      EDT_REFRESH_SECONDS: ${EDT_REFRESH_SECONDS:-900}
      EDT_UPSTREAM_TIMEOUT_SECONDS: ${EDT_UPSTREAM_TIMEOUT_SECONDS:-15}
      EDT_LOG: ${EDT_LOG:-info}
    volumes:
      # Les PDF téléchargés survivent aux redémarrages : le service continue de
      # répondre même si le serveur du département est indisponible.
      - edt-cache:/app/cache
    expose:
      - "3000"
    # Décommenter pour joindre l'API directement, hors de nginx.
    # ports:
    #   - "3000:3000"

  web:
    build:
      context: ./frontend
    image: edt-unilim-front
    restart: unless-stopped
    ports:
      - "${EDT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  edt-cache:
