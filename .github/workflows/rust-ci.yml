name: API Rust

on:
  push:
    branches: [master]
    paths:
      - "APIRust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "APIRust/**"
      - ".github/workflows/rust-ci.yml"

defaults:
  run:
    working-directory: APIRust

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: APIRust
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: APIRust
      - run: cargo test --all-targets

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: APIRust
      - run: cargo build --release
