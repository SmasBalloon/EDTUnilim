name: API Rust

on:
  push:
    branches: [master]
    paths:
      - "APIRust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "APIRust/**"
      - ".github/workflows/rust-ci.yml"

defaults:
  run:
    working-directory: APIRust

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: APIRust
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: APIRust
      - run: cargo test --all-targets

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: APIRust
      - run: cargo build --release

  coverage:
    name: Couverture de tests
    runs-on: ubuntu-latest
    needs: test
    # Uniquement sur master : une PR ne doit pas pousser de commit, surtout
    # venant d'un fork qui n'a pas les droits d'écriture.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: APIRust
      - run: cargo llvm-cov --cobertura --output-path coverage.xml

      - name: Reporter le badge de couverture dans le README
        working-directory: .
        run: |
          rate=$(grep -oP 'line-rate="\K[0-9.]+' APIRust/coverage.xml | head -1)
          pct=$(awk -v r="$rate" 'BEGIN { printf "%.1f", r * 100 }')
          color=$(awk -v p="$pct" 'BEGIN {
            if (p >= 90) print "brightgreen";
            else if (p >= 75) print "yellow";
            else if (p >= 50) print "orange";
            else print "red";
          }')
          badge="https://img.shields.io/badge/couverture_API-${pct}%25-${color}"
          sed -i "s|<!-- coverage:start -->.*<!-- coverage:end -->|<!-- coverage:start -->![Couverture des tests (API Rust)](${badge})<!-- coverage:end -->|" README.md
          rm APIRust/coverage.xml

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: mettre à jour la couverture de tests dans le README [skip ci]"
          file_pattern: README.md
