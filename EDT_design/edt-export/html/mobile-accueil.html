<div class="app" style="display: flex; flex-direction: column; width: 390px; height: 844px; min-height: 0; padding: 28px 20px 24px; gap: 22px; overflow: hidden">
<div class="row" style="gap: 12px"><div class="logo" style="margin: 0; width: 40px; height: 40px; border-radius: 12px; font-size: 13px">EDT</div><span class="lbl">IUT du Limousin</span></div>
<div><h1 style="font-size: 34px">Choisis ta classe</h1><p class="sub" style="font-size: 14px; line-height: 1.5">Ton année et ton groupe sont gardés sur cet appareil.</p></div>
<div style="display: flex; flex-direction: column; gap: 10px"><span class="lbl">Année</span><div class="row" style="gap: 8px"><button class="opt">BUT 1</button><button class="opt">BUT 2</button><button class="opt on">BUT 3</button></div></div>
<div style="display: flex; flex-direction: column; gap: 10px"><span class="lbl">Groupe principal</span><div class="row" style="gap: 8px"><button class="opt on">G7</button></div></div>
<div style="display: flex; flex-direction: column; gap: 10px"><span class="lbl">Sous-groupe</span><div class="row" style="gap: 8px"><button class="opt">A</button><button class="opt on">B</button></div></div>
<button class="btn pri" style="justify-content: center; min-height: 52px; font-size: 16px; margin-top: 6px">Voir mon emploi du temps</button>
<div class="card" style="padding: 16px; color: var(--mu); font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; gap: 8px; margin-top: auto">
<p>Ou <a class="lnk" href="#">connecte-toi avec Discord</a> pour recevoir ton emploi du temps et ses changements en message privé.</p>
<p>Ou <a class="lnk" href="#">analyse des PDF</a> pour repérer les salles réservées deux fois.</p>
</div>
</div>
