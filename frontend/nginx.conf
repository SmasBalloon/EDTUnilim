server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/calendar;
    gzip_min_length 512;

    # L'API est servie sous la même origine : le front n'a aucune URL absolue.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Les noms de fichiers portent une empreinte : ils ne changent jamais.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Le service worker et le manifeste doivent être revalidés à chaque visite,
    # sans quoi une version périmée de l'application resterait installée.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Application à page unique : toute route inconnue rend index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
