[package]
name = "edt-unilim-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "API de consultation des emplois du temps de l'IUT informatique de Limoges"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "cors", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "multipart"] }
lopdf = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde-well-known"] }
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"
ed25519-dalek = "3.0.0"

[dev-dependencies]
axum-test = "21"
serial_test = "4.0.1"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
